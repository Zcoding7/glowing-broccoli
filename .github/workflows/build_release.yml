name: Build Windows EXE Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --name TemperatureStudio --add-data "app.py;." --collect-all streamlit --collect-all audio_recorder_streamlit --collect-all speech_recognition run_desktop.py

      - name: Upload EXE to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TemperatureStudio.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
